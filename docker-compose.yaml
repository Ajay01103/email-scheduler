name: email-scheduler

x-app: &app
  image: localhost/email-scheduler:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgresql://emails:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/emails
    REDIS_URL: redis://redis:6379
    ELASTICSEARCH_URL: http://elasticsearch:9200
    ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-emails}
    PORT: ${PORT:-3000}
    API_KEY: ${API_KEY:?Set API_KEY to at least 32 characters in .env}
    DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in .env}
    DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD to at least 16 characters in .env}
    SMTP_HOST: ${CONTAINER_SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM_DOMAIN: ${SMTP_FROM_DOMAIN:-example.test}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    MIN_SEND_INTERVAL_MS: ${MIN_SEND_INTERVAL_MS:-1000}
    MAX_EMAILS_PER_HOUR_PER_SENDER: ${MAX_EMAILS_PER_HOUR_PER_SENDER:-200}
    OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
    RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-30000}
    SEND_LEASE_MS: ${SEND_LEASE_MS:-120000}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: emails
      POSTGRES_USER: emails
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Avoid requiring a host vm.max_map_count change for local development.
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["node", "dist/api.js"]
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    stop_grace_period: 100s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
